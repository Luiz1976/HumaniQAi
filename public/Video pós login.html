<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HumaniQ AI - Splash Screen</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            overflow: hidden;
        }

        .splash-screen {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background: linear-gradient(135deg, #0a1628 0%, #1a2a4a 50%, #0d1b2a 100%);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 9999;
            opacity: 1;
            transition: opacity 0.8s ease-out;
        }

        .splash-screen.fade-out {
            opacity: 0;
            pointer-events: none;
        }

        /* Canvas para partículas */
        #particles-canvas {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 1;
        }

        /* Conteúdo do splash */
        .splash-content {
            position: relative;
            z-index: 2;
            text-align: center;
            opacity: 0;
            animation: fadeInContent 2.25s ease-out 0.75s forwards;
        }

        .logo-text {
            font-size: 4rem;
            font-weight: 700;
            color: #ffffff;
            letter-spacing: 0.1em;
            text-shadow: 0 0 20px rgba(66, 153, 225, 0.5);
            margin-bottom: 1rem;
            position: relative;
        }

        .logo-highlight {
            color: #4A90E2;
            text-shadow:
                0 0 10px rgba(74, 144, 226, 0.8),
                0 0 20px rgba(74, 144, 226, 0.6),
                0 0 30px rgba(74, 144, 226, 0.4);
        }

        /* Smile Arc SVG */
        .smile-arc-container {
            position: absolute;
            width: 100%;
            height: 100px;
            top: 85%;
            left: 0;
            overflow: visible;
            opacity: 0;
            animation: fadeInArc 1.5s ease-out 0.8s forwards;
        }

        .smile-arc {
            stroke: url(#arcGradient);
            stroke-linecap: round;
            fill: none;
            filter: drop-shadow(0 0 8px rgba(74, 144, 226, 0.6));
        }

        @keyframes fadeInArc {
            from {
                opacity: 0;
            }

            to {
                opacity: 1;
            }
        }

        @keyframes drawArc {
            to {
                stroke-dashoffset: 0;
            }
        }

        .subtitle {
            font-size: 1.2rem;
            font-weight: 300;
            color: #7AB8E8;
            letter-spacing: 0.3em;
            text-transform: uppercase;
            margin-top: 4rem;
            opacity: 0;
            animation: fadeInSubtitle 2.25s ease-out 1.8s forwards;
        }

        /* Loading indicator */
        .loading-bar {
            width: 300px;
            height: 3px;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 10px;
            margin-top: 3rem;
            overflow: hidden;
            opacity: 0;
            animation: fadeInLoading 1s ease-out 2s forwards;
        }

        .loading-progress {
            height: 100%;
            width: 0%;
            background: linear-gradient(90deg, #4A90E2, #7AB8E8, #4A90E2);
            background-size: 200% 100%;
            border-radius: 10px;
            animation: loadingProgress 3s ease-out forwards,
                shimmer 1.5s infinite;
        }

        @keyframes fadeInContent {
            from {
                opacity: 0;
                transform: translateY(20px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        @keyframes fadeInSubtitle {
            from {
                opacity: 0;
                transform: translateY(10px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        @keyframes fadeInLoading {
            from {
                opacity: 0;
            }

            to {
                opacity: 1;
            }
        }

        @keyframes loadingProgress {
            from {
                width: 0%;
            }

            to {
                width: 100%;
            }
        }

        @keyframes shimmer {
            0% {
                background-position: 200% 0;
            }

            100% {
                background-position: -200% 0;
            }
        }

        /* Responsive */
        @media (max-width: 768px) {
            .logo-text {
                font-size: 2.5rem;
            }

            .subtitle {
                font-size: 0.9rem;
            }

            .loading-bar {
                width: 200px;
            }
        }
    </style>
</head>

<body>
    <div class="splash-screen" id="splashScreen">
        <canvas id="particles-canvas"></canvas>

        <div class="splash-content">
            <div class="logo-text">
                HumaniQ <span class="logo-highlight">AI</span>

                <!-- Smile Arc SVG -->
                <svg class="smile-arc-container" viewBox="0 0 800 120" preserveAspectRatio="xMidYMid meet">
                    <defs>
                        <!-- Gradient for arc color -->
                        <linearGradient id="arcGradient" x1="0%" y1="0%" x2="100%" y2="0%">
                            <stop offset="0%" style="stop-color:#4A90E2; stop-opacity:0.95" />
                            <stop offset="50%" style="stop-color:#5BA3F5; stop-opacity:1" />
                            <stop offset="100%" style="stop-color:#7AB8E8; stop-opacity:1" />
                        </linearGradient>

                        <!-- ClipPath para revelar arco de H→I -->
                        <clipPath id="arcReveal">
                            <rect x="0" y="0" width="0" height="120">
                                <animate attributeName="width" from="0" to="800" dur="3s" begin="1.2s" fill="freeze" />
                            </rect>
                        </clipPath>

                        <!-- Gradiente radial para brilho intenso no final -->
                        <radialGradient id="arcEndGlow">
                            <stop offset="0%" style="stop-color:#FFFFFF; stop-opacity:1" />
                            <stop offset="30%" style="stop-color:#7AB8E8; stop-opacity:0.95" />
                            <stop offset="70%" style="stop-color:#4A90E2; stop-opacity:0.6" />
                            <stop offset="100%" style="stop-color:#4A90E2; stop-opacity:0" />
                        </radialGradient>
                    </defs>

                    <!-- Arco com espessura variável: fino no H, grosso no I -->
                    <!-- A curva vai de x=30 (abaixo do H) até x=770 (abaixo do I) -->
                    <!-- Q 400,100 = ponto de controle para curva mais profunda (sorriso) -->


                    <!-- ARCO CONTÍNUO: FINO no H → GROSSO no I -->
                    <g clip-path="url(#arcReveal)">
                        <!-- Arco limpo com stroke (sem forma preenchida) -->
                        <path d="M 30,20 Q 400,90 770,20" stroke="url(#arcGradient)" stroke-width="4"
                            stroke-linecap="round" fill="none" filter="drop-shadow(0 0 10px rgba(74, 144, 226, 0.7))" />

                        <!-- Final arredondado e brilhante (perto do I) -->
                        <circle cx="773" cy="18" r="10" fill="url(#arcEndGlow)"
                            filter="drop-shadow(0 0 15px rgba(122, 184, 232, 0.95))" opacity="0.95" />

                        <!-- Brilho extra no final -->
                        <circle cx="773" cy="18" r="6" fill="rgba(255, 255, 255, 0.8)" filter="blur(2px)"
                            opacity="0.9" />
                    </g>
                </svg>
            </div>
            <div class="subtitle">
                INTELIGÊNCIA PSICOSSOCIAL
            </div>
        </div>
    </div>

    <script>
        const canvas = document.getElementById('particles-canvas');
        const ctx = canvas.getContext('2d');

        canvas.width = window.innerWidth;
        canvas.height = window.innerHeight;

        // Arrays para diferentes elementos do universo
        const stars = [];
        const shootingStars = [];
        const starCount = 300; // Mais estrelas para realismo

        // Classe Estrela Realista
        class Star {
            constructor() {
                this.x = Math.random() * canvas.width;
                this.y = Math.random() * canvas.height;

                // Profundidade (estrelas distantes são menores)
                this.depth = Math.random();
                this.size = (0.3 + this.depth * 2.5) * (Math.random() * 0.5 + 0.5);

                // Cores realistas de estrelas
                const rand = Math.random();
                if (rand < 0.4) {
                    this.color = [255, 255, 255]; // Branca
                } else if (rand < 0.65) {
                    this.color = [200, 220, 255]; // Azul
                } else if (rand < 0.85) {
                    this.color = [255, 244, 220]; // Amarela
                } else if (rand < 0.95) {
                    this.color = [255, 220, 180]; // Laranja
                } else {
                    this.color = [255, 200, 200]; // Vermelha
                }

                this.brightness = Math.random();
                this.twinkleSpeed = (Math.random() * 0.015 + 0.003) * (1 - this.depth * 0.5);
                this.twinklePhase = Math.random() * Math.PI * 2;

                // Movimento parallax
                this.speedX = (Math.random() - 0.5) * 0.05 * this.depth;
                this.speedY = (Math.random() - 0.5) * 0.05 * this.depth;
            }

            update() {
                this.twinklePhase += this.twinkleSpeed;
                this.brightness = (Math.sin(this.twinklePhase) + 1) / 2;

                // Movimento parallax
                this.x += this.speedX;
                this.y += this.speedY;

                if (this.x < 0) this.x = canvas.width;
                if (this.x > canvas.width) this.x = 0;
                if (this.y < 0) this.y = canvas.height;
                if (this.y > canvas.height) this.y = 0;
            }


            draw() {
                const alpha = this.brightness * (0.4 + this.depth * 0.6);
                const [r, g, b] = this.color;

                // Estrela principal
                ctx.fillStyle = `rgba(${r}, ${g}, ${b}, ${alpha})`;
                ctx.beginPath();
                ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
                ctx.fill();

                // Brilho difuso
                if (this.size > 1.2 && this.depth > 0.5) {
                    const gradient = ctx.createRadialGradient(
                        this.x, this.y, 0,
                        this.x, this.y, this.size * 4
                    );
                    gradient.addColorStop(0, `rgba(${r}, ${g}, ${b}, ${alpha * 0.4})`);
                    gradient.addColorStop(0.3, `rgba(${r}, ${g}, ${b}, ${alpha * 0.2})`);
                    gradient.addColorStop(1, 'rgba(255, 255, 255, 0)');

                    ctx.fillStyle = gradient;
                    ctx.beginPath();
                    ctx.arc(this.x, this.y, this.size * 4, 0, Math.PI * 2);
                    ctx.fill();
                }

                // Cruz de luz para estrelas brilhantes
                if (this.size > 1.8 && this.brightness > 0.7 && this.depth > 0.6) {
                    ctx.strokeStyle = `rgba(${r}, ${g}, ${b}, ${alpha * 0.5})`;
                    ctx.lineWidth = 0.5;
                    const crossSize = this.size * 3;

                    ctx.beginPath();
                    ctx.moveTo(this.x - crossSize, this.y);
                    ctx.lineTo(this.x + crossSize, this.y);
                    ctx.stroke();

                    ctx.beginPath();
                    ctx.moveTo(this.x, this.y - crossSize);
                    ctx.lineTo(this.x, this.y + crossSize);
                    ctx.stroke();
                }
            }
        }

        // Classe Cometa/Estrela Cadente
        class ShootingStar {
            constructor() {
                this.reset();
            }

            reset() {
                // Posição aleatória em qualquer borda da tela
                const side = Math.floor(Math.random() * 4);

                if (side === 0) { // Topo
                    this.x = Math.random() * canvas.width;
                    this.y = 0;
                    this.angle = Math.random() * Math.PI; // 0 a 180 graus (para baixo)
                } else if (side === 1) { // Direita
                    this.x = canvas.width;
                    this.y = Math.random() * canvas.height;
                    this.angle = Math.PI / 2 + Math.random() * Math.PI; // 90 a 270 graus (para esquerda)
                } else if (side === 2) { // Esquerda
                    this.x = 0;
                    this.y = Math.random() * canvas.height;
                    this.angle = -Math.PI / 2 + Math.random() * Math.PI; // -90 a 90 graus (para direita)
                } else { // Baixo (menos comum)
                    this.x = Math.random() * canvas.width;
                    this.y = canvas.height;
                    this.angle = Math.PI + Math.random() * Math.PI; // 180 a 360 graus (para cima)
                }

                this.length = Math.random() * 80 + 40;
                this.speed = Math.random() * 6 + 4;
                this.opacity = 1;
                this.tail = [];
            }

            update() {
                this.x += Math.cos(this.angle) * this.speed;
                this.y += Math.sin(this.angle) * this.speed;

                // Adicionar posição à cauda
                this.tail.unshift({ x: this.x, y: this.y });
                if (this.tail.length > 20) this.tail.pop();

                this.opacity -= 0.01;

                // Reset quando sair da tela
                if (this.x > canvas.width || this.y > canvas.height || this.opacity <= 0) {
                    this.reset();
                }
            }

            draw() {
                ctx.save();

                // Desenhar cauda
                for (let i = 0; i < this.tail.length; i++) {
                    const alpha = (this.opacity * (1 - i / this.tail.length)) * 0.8;
                    const size = (1 - i / this.tail.length) * 2;

                    ctx.fillStyle = `rgba(255, 255, 255, ${alpha})`;
                    ctx.beginPath();
                    ctx.arc(this.tail[i].x, this.tail[i].y, size, 0, Math.PI * 2);
                    ctx.fill();
                }

                // Desenhar cabeça brilhante
                const gradient = ctx.createRadialGradient(
                    this.x, this.y, 0,
                    this.x, this.y, 6
                );
                gradient.addColorStop(0, `rgba(255, 255, 255, ${this.opacity})`);
                gradient.addColorStop(0.5, `rgba(150, 200, 255, ${this.opacity * 0.5})`);
                gradient.addColorStop(1, `rgba(100, 150, 255, 0)`);

                ctx.fillStyle = gradient;
                ctx.beginPath();
                ctx.arc(this.x, this.y, 6, 0, Math.PI * 2);
                ctx.fill();

                ctx.restore();
            }
        }

        // Inicializar estrelas
        function initUniverse() {
            for (let i = 0; i < starCount; i++) {
                stars.push(new Star());
            }

            // Criar cometas em várias direções
            for (let i = 0; i < 5; i++) {
                shootingStars.push(new ShootingStar());
            }
        }

        // Desenhar nebulosa de fundo
        function drawNebula() {
            const nebulaGradient = ctx.createRadialGradient(
                canvas.width * 0.3, canvas.height * 0.3, 0,
                canvas.width * 0.3, canvas.height * 0.3, canvas.width * 0.6
            );
            nebulaGradient.addColorStop(0, 'rgba(30, 60, 120, 0.1)');
            nebulaGradient.addColorStop(0.5, 'rgba(50, 80, 150, 0.05)');
            nebulaGradient.addColorStop(1, 'rgba(10, 20, 40, 0)');

            ctx.fillStyle = nebulaGradient;
            ctx.fillRect(0, 0, canvas.width, canvas.height);
        }

        // Animar universo
        function animateUniverse() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);

            // Desenhar nebulosa
            drawNebula();

            // Atualizar e desenhar estrelas
            stars.forEach(star => {
                star.update();
                star.draw();
            });

            // Atualizar e desenhar cometas
            shootingStars.forEach(shootingStar => {
                shootingStar.update();
                shootingStar.draw();
            });

            requestAnimationFrame(animateUniverse);
        }

        // Redimensionar canvas
        window.addEventListener('resize', () => {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
        });

        // Inicializar e animar
        initUniverse();
        animateUniverse();

        // Auto-fechar splash screen após 7.5 segundos (50% mais longo)
        setTimeout(() => {
            const splashScreen = document.getElementById('splashScreen');
            splashScreen.classList.add('fade-out');

            // Remover do DOM após transição
            setTimeout(() => {
                splashScreen.remove();
            }, 800);
        }, 7500); // 7500ms = 7.5 segundos

        // Função para fechar manualmente (pode ser chamada quando o conteúdo carregar)
        function closeSplashScreen() {
            const splashScreen = document.getElementById('splashScreen');
            if (splashScreen) {
                splashScreen.classList.add('fade-out');
                setTimeout(() => {
                    splashScreen.remove();
                }, 800);
            }
        }

        // Disponibilizar função globalmente
        window.closeSplashScreen = closeSplashScreen;
    </script>
</body>

</html>
